{% extends "base.html" %}
{% block heading %}Saved queries{% endblock %}
{% block body %}
{% if reports %}
<div class="card"><ul class="list-group list-group-flush">
  {% for name, path, count in reports %}
  <li class="list-group-item d-flex justify-content-between gap-2"><a href="{{ link(path) }}">{{ name }}</a><span class="text-secondary text-nowrap">{{ "{:,}".format(count) }} rows</span></li>
  {% endfor %}
</ul></div>
{% else %}
<p class="text-secondary">No saved queries are selected.</p>
{% endif %}
{% endblock %}
