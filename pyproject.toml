[project]
name = "beanie-ledger"
version = "0.3.0"
description = "Fast, read-only static reports for Beancount 3 ledgers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["beancount>=3.2,<4", "beanquery>=0.2,<1", "jinja2>=3.1,<4"]

[project.scripts]
beanie = "beanie_ledger.cli:main"

[project.urls]
Repository = "https://github.com/yogenpro/beanie"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
